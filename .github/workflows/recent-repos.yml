name: Update README with recently active repos
on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-recent-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build recent repos block
        uses: actions/github-script@v7
        env:
          GH_USER: travishankins
          REPO_COUNT: "5"
        with:
          script: |
            const fs = require('fs');
            const user = process.env.GH_USER;
            const count = parseInt(process.env.REPO_COUNT, 10);

            // Pull the user's most-recently-pushed public repos (excluding forks).
            const { data: repos } = await github.rest.repos.listForUser({
              username: user,
              sort: 'pushed',
              direction: 'desc',
              per_page: 30,
            });

            const picks = repos
              .filter(r => !r.fork && !r.archived && r.name.toLowerCase() !== user.toLowerCase())
              .slice(0, count);

            // Pick an emoji based on repo language / name keywords.
            const pickEmoji = (r) => {
              const n = r.name.toLowerCase();
              const lang = (r.language || '').toLowerCase();
              if (n.includes('terraform') || lang === 'hcl') return '🌍';
              if (n.includes('bicep') || lang === 'bicep') return '💪';
              if (n.includes('azure')) return '☁️';
              if (n.includes('docker') || n.includes('container')) return '🐳';
              if (n.includes('k8s') || n.includes('kube')) return '⎈';
              if (n.includes('action') || n.includes('workflow')) return '⚙️';
              if (n.includes('cost') || n.includes('billing')) return '💸';
              if (n.includes('monitor') || n.includes('observ')) return '📈';
              if (n.includes('demo') || n.includes('sample')) return '🧪';
              if (n.includes('purge') || n.includes('clean')) return '🧹';
              if (n.includes('agent') || n.includes('ai')) return '🤖';
              if (n.includes('launch') || n.includes('starter')) return '🚀';
              if (lang === 'python') return '🐍';
              if (lang === 'typescript' || lang === 'javascript') return '📜';
              if (lang === 'powershell') return '💠';
              return '📦';
            };

            // Render as a simple bullet list with emoji + linked repo name + description.
            const lines = picks.map(r => {
              const url = `https://github.com/${user}/${r.name}`;
              const desc = r.description ? ` — ${r.description}` : '';
              return `- ${pickEmoji(r)} [**${r.name}**](${url})${desc}`;
            }).join('\n');

            const block = `<!-- RECENT-REPOS:START -->\n${lines}\n<!-- RECENT-REPOS:END -->`;

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const updated = readme.replace(
              /<!-- RECENT-REPOS:START -->[\s\S]*?<!-- RECENT-REPOS:END -->/,
              block
            );

            if (updated !== readme) {
              fs.writeFileSync(readmePath, updated);
              core.info(`Updated README with ${picks.length} repos.`);
            } else {
              core.info('No change to README.');
            }

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update recently active repos"
            git push
          else
            echo "No changes to commit."
          fi
